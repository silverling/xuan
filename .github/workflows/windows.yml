name: Windows
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Set up Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc
      - name: Check and test
        run: scripts/check.sh
      - name: Package
        run: python scripts/package-windows.py
      - name: Verify distribution packages
        run: python scripts/check-packages.py
      - name: Native DirectX 12 smoke test
        env:
          WGPU_BACKEND: dx12
        run: |
          python - <<'PY'
          import struct
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          package, = Path('dist').glob('xuan-*-windows-x86_64.zip')
          with tempfile.TemporaryDirectory(prefix='xuan smoke ') as directory:
              root = Path(directory)
              with zipfile.ZipFile(package) as archive:
                  archive.extractall(root)
              executable = root / package.stem / 'xuan.exe'
              screenshot = root / 'demo.png'
              subprocess.run(
                  [executable, '--demo', '--screenshot', screenshot],
                  check=True,
                  timeout=180,
              )
              data = screenshot.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Missing or invalid screenshot'
              width, height = struct.unpack('>II', data[16:24])
              assert width >= 850 and height >= 560, (width, height)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xuan-windows-x86_64
          # The Linux job supplies the shared source archive for releases.
          path: dist/xuan-*-windows-x86_64.zip*
          if-no-files-found: error
